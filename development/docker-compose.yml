services:
  postgres:
    # Default: postgres:17 (tsvector ranking, no extensions needed)
    # For BM25: PG_IMAGE=tensorchord/vchord-suite:pg17-latest docker compose up -d
    image: ${PG_IMAGE:-postgres:17}
    environment:
      POSTGRES_USER: zodb
      POSTGRES_PASSWORD: zodb
      POSTGRES_DB: zodb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zodb"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-tuning:
    # Turns off fsync and synchronous_commit: the full test suite runs about
    # 28 % faster. The price: an OS crash or power loss can corrupt the
    # databases in this volume (a normal stop or restart is safe).
    # Not a `command:` on the postgres service, because that would replace
    # the BM25 image's own command (shared_preload_libraries). ALTER SYSTEM
    # works with both images and persists in the volume.
    image: ${PG_IMAGE:-postgres:17}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: zodb
      PGPASSWORD: zodb
      PGDATABASE: zodb
    entrypoint: ["sh", "-c"]
    # The retry covers the first start, when initdb's temporary server
    # already answers the healthcheck but not yet on TCP.
    command:
      - >-
        until psql -Atqc "SELECT 1" > /dev/null 2>&1; do sleep 1; done;
        psql -v ON_ERROR_STOP=1
        -c "ALTER SYSTEM SET fsync = off"
        -c "ALTER SYSTEM SET synchronous_commit = off"
        -c "SELECT pg_reload_conf()"
    restart: "no"

  garage:
    image: dxflrs/garage:v2.3.0
    # --single-node creates and applies the cluster layout;
    # --default-access-key / --default-bucket create the key and the bucket
    # from the GARAGE_DEFAULT_* variables. No bootstrap container needed.
    command:
      ["/garage", "server", "--single-node", "--default-access-key", "--default-bucket"]
    environment:
      # Must match s3-access-key / s3-secret-key / s3-bucket-name in zope.conf.
      # Garage format: key = GK + 24 hex chars, secret = 64 hex chars.
      # Local demo values, not real secrets.
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef01234567
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: zodb-blobs
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  pgdata:
  garagedata:
